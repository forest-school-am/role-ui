# Runs only the application against an existing authentik instance.
# Copy app.env.example to .env and fill in the values, then:
#   GITHUB_TOKEN=<pat> docker compose -f docker-compose.app.yml up --build

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
      secrets:
        - github_token

secrets:
  github_token:
    environment: GITHUB_TOKEN
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      AUTHENTIK_BASE_URL: ${AUTHENTIK_BASE_URL}
      AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      AUDIT_LOG_PATH: ${AUDIT_LOG_PATH:-/app/audit.log}
    restart: unless-stopped
