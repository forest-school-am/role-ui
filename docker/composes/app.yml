# Runs only the application against an existing authentik instance.
# Copy app.env.example to .env and fill in the values, then:
#   docker compose -f docker-compose.app.yml up
#
# The image is pulled from GitHub Container Registry.
# Pin a specific release with: IMAGE_TAG=sha-<commit> docker compose -f docker-compose.app.yml up

services:
  app:
    image: ghcr.io/forest-school-am/role-ui:${IMAGE_TAG:-latest}
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    environment:
      AUTHENTIK_BASE_URL: ${AUTHENTIK_BASE_URL}
      AUTHENTIK_API_TOKEN: ${AUTHENTIK_API_TOKEN}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID}
      OIDC_REDIRECT_URI: ${OIDC_REDIRECT_URI}
      AUDIT_LOG_PATH: ${AUDIT_LOG_PATH:-/app/audit.log}
    restart: unless-stopped
