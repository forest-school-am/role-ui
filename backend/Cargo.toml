[package]
name = "authentik-role-ui-backend"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "server"
path = "src/main.rs"

[dependencies]
autentik-macros = { path = "macros" }
const_format = "0.2"
axum = { version = "0.7", features = ["macros"] }
axum-extra = { version = "0.9", features = ["typed-header"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower-http = { version = "0.5", features = ["cors", "trace", "fs"] }
futures = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
thiserror = "1"
dotenvy = "0.15"
headers = "0.4"
sha2 = "0.10"
moka = { version = "0.12", features = ["future"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
urlencoding = "2"
enum-map = { version = "3.0.0-beta.2" , features = ["serde"]}
itertools = "0.14.0"
regex = "1.12.3"

authentik_api = { git = "https://github.com/forest-school-am/authentik_api_2026_5_2", rev = "61267dd73615dc0aeedaf3582a069e5d119cd529" }
authentik-forest-school-attributes = { git = "https://github.com/forest-school-am/authentik_forest_school_attributes", rev = "ff3c882e9fb57542b0dd239de42444b7f15473c0" }
uuid = { version = "1", features = ["serde"] }